name: cola-skeleton

on:
  push:
    branches: [main]
    paths:
      - "cola-skeleton/**"
      - ".github/workflows/cola-skeleton.yml"
  pull_request:
    paths:
      - "cola-skeleton/**"
      - ".github/workflows/cola-skeleton.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cola-skeleton
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cola-skeleton/pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
